<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temple Time</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="bar">
    <h1>Temple Time</h1>
    <nav id="site-nav"></nav>
    <div class="header-right"><button class="btn secondary" id="logout-btn">Log Out</button></div>
  </div>
</header>

<main>
  <div id="content"><p class="note">Loading...</p></div>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/photo.js"></script>
<script>
let _nextPlan = null;

async function loadDashboard() {
  const content = document.getElementById('content');
  await initPage('index.html');
  try {
    const [templesRes, visitsRes, photosRes, plansRes] = await Promise.all([
      fetchData('temples'), fetchData('visits'), fetchData('photos'), fetchData('plans'),
    ]);
    const temples = templesRes.temples || [];
    const visits = visitsRes.visits || [];
    const photos = photosRes.photos || [];
    const today = todayStr();
    const upcomingPlans = (plansRes.plans || [])
      .filter(p => p.Status === 'Planned' && p.PlannedDate >= today)
      .sort((a, b) => (a.PlannedDate + (a.PlannedTime || '')).localeCompare(b.PlannedDate + (b.PlannedTime || '')));

    if (temples.length === 0) {
      content.innerHTML = emptyStateHtml(
        'Welcome to Temple Time',
        'Begin building your temple journey.',
        `<p><a class="btn" href="temples.html?add=1">Add Your First Temple</a></p>`
      );
      return;
    }

    const thisYear = new Date().getFullYear();
    const visitsThisYear = visits.filter(v => v.VisitDate && v.VisitDate.startsWith(String(thisYear))).length;
    const differentTemples = new Set(visits.map(v => v.TempleId)).size;
    const streak = currentWeeklyStreak(visits.map(v => v.VisitDate));
    const visitList = temples.filter(t => t.OnVisitList);

    let html = `
      <div class="quick-actions">
        <a class="btn" href="visit-edit.html">Quick Log</a>
        <a class="btn secondary" href="plan-edit.html">Plan a Visit</a>
        <a class="btn secondary" href="temples.html?add=1">Add Temple</a>
        <a class="btn secondary" href="temples.html?view=visitlist">View My Visit List</a>
        <span class="btn disabled" title="Coming in Phase 5">Nearby Temples</span>
        <a class="btn secondary" href="photos.html">Photo Gallery</a>
      </div>
    `;

    if (upcomingPlans.length) {
      const next = upcomingPlans[0];
      _nextPlan = next;
      const when = next.PlannedTime ? `${formatDate(next.PlannedDate)} · ${formatTime(next.PlannedTime)}` : formatDate(next.PlannedDate);
      const bits = [purposeSummary(next.Purposes), whoWithSummary(next.WhoWith)].filter(Boolean);
      html += `
        <h2>Coming Up</h2>
        <div class="card">
          <h3 style="margin-bottom:0.2rem">${escapeHtml(next.TempleName)}</h3>
          <p class="meta">${escapeHtml(when)}</p>
          ${bits.length ? `<p class="meta">${escapeHtml(bits.join(' · '))}</p>` : ''}
          <p class="meta">${next.AppointmentScheduled ? '✓ Appointment Scheduled' : '<strong style="color:#a33">⚠ Appointment Not Yet Scheduled</strong>'}</p>
          <div class="detail-actions">
            <a class="btn secondary" href="${mapsUrl(planTempleForMaps(next))}" target="_blank" rel="noopener">Navigate</a>
            <button type="button" class="btn secondary" onclick="downloadCalendarEvent(_nextPlan)">Calendar</button>
            <a class="btn" href="visit-edit.html?fromPlan=${next.Id}">Log Visit</a>
          </div>
        </div>
        ${upcomingPlans.length > 1 ? `<p><a href="plans.html">View All Plans &rarr;</a></p>` : ''}
      `;
    }

    html += statRowHtml([
      { num: visits.length, label: 'Total Visits' },
      { num: differentTemples, label: 'Different Temples' },
      { num: visitsThisYear, label: 'Visits This Year' },
      { num: streak, label: 'Current Weekly Streak' },
    ]);

    if (visitList.length) {
      html += `<div class="card">
        <h3>My Visit List</h3>
        <p class="meta">${visitList.slice(0, 6).map(t => escapeHtml(t.Name)).join(' · ')}${visitList.length > 6 ? ` +${visitList.length - 6} more` : ''}</p>
        <p><a href="temples.html?view=visitlist">View all &rarr;</a></p>
      </div>`;
    }

    html += `<h2>Recent Visits</h2>`;
    if (!visits.length) {
      html += emptyStateHtml(
        'No temple visits have been recorded yet.',
        '',
        `<p><a class="btn" href="visit-edit.html">Quick Log Your First Visit</a></p>`
      );
    } else {
      html += `<div class="card-grid">${visits.slice(0, 10).map(visitCardHtml).join('')}</div>`;
      if (visits.length > 10) html += `<p><a href="visits.html">View all Visits &rarr;</a></p>`;
    }

    if (photos.length) {
      const recentOrFavorite = photos.filter(p => p.Favorite).concat(photos.filter(p => !p.Favorite)).slice(0, 8);
      html += `<h2>Recent Memories</h2><div class="card-grid">${recentOrFavorite.map(photoCardHtml).join('')}</div>`;
      html += `<p><a href="photos.html">View all Photos &rarr;</a></p>`;
    }

    content.innerHTML = html;
  } catch (err) {
    handleError(content, err);
  }
}
loadDashboard();
</script>
</body>
</html>
