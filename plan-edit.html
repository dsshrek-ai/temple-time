<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan a Visit — Temple Time</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="bar">
    <h1>Temple Time</h1>
    <nav id="site-nav"></nav>
    <div class="header-right"><button class="btn secondary" id="logout-btn">Log Out</button></div>
  </div>
</header>

<main>
  <div id="content"><p class="note">Loading...</p></div>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
function checkGroupHtml(name, options, idPrefix) {
  return `<div class="check-group">${options.map((o, i) => `
    <label><input type="checkbox" name="${name}" value="${escapeHtml(o)}" id="${idPrefix}-${i}"> ${escapeHtml(o)}</label>
  `).join('')}</div>`;
}

async function submitForm(ev) {
  ev.preventDefault();
  const msg = document.getElementById('form-msg');
  const templeId = Number(document.getElementById('pl-temple').value);
  const plannedDate = document.getElementById('pl-date').value;
  if (!templeId) { msg.innerHTML = '<p class="field-error">Temple is required.</p>'; return; }
  if (!plannedDate) { msg.innerHTML = '<p class="field-error">Planned Date is required.</p>'; return; }

  const payload = {
    templeId,
    plannedDate,
    plannedTime: document.getElementById('pl-time').value,
    endTime: document.getElementById('pl-endtime').value,
    groupName: document.getElementById('pl-group').value.trim(),
    notes: document.getElementById('pl-notes').value.trim(),
    personIds: Array.from(document.querySelectorAll('input[name="whowith"]:checked')).map(cb => Number(cb.value)),
    purposes: Array.from(document.querySelectorAll('input[name="purpose"]:checked')).map(cb => cb.value),
    workPerformed: Array.from(document.querySelectorAll('input[name="work"]:checked')).map(cb => cb.value),
    appointmentScheduled: document.getElementById('pl-scheduled').checked,
  };

  try {
    const res = await postAction('addPlan', payload);
    window.location.href = `plan.html?id=${res.id}`;
  } catch (err) {
    msg.innerHTML = `<p class="field-error">${escapeHtml(err.message || 'Could not save.')}</p>`;
  }
}

async function loadForm() {
  const content = document.getElementById('content');
  await initPage('plans.html');
  const params = new URLSearchParams(window.location.search);
  const templeIdParam = params.get('templeId');

  try {
    const [templesRes, peopleRes, vocab] = await Promise.all([
      fetchData('temples'), fetchData('people'), getVocab(),
    ]);
    const temples = templesRes.temples || [];
    const people = (peopleRes.people || []).filter(p => p.Active);

    if (!temples.length) {
      content.innerHTML = emptyStateHtml('Add a temple first', 'You need at least one Temple before you can plan a Visit.',
        `<p><a class="btn" href="temples.html?add=1">Add Temple</a></p>`);
      return;
    }

    const preselectTempleId = templeIdParam ? Number(templeIdParam) : temples[0].Id;

    content.innerHTML = `
      <h2>Plan a Visit</h2>
      <form id="plan-form" class="card">
        <label for="pl-temple">Temple</label>
        <select id="pl-temple" required>
          ${temples.map(t => `<option value="${t.Id}" ${t.Id === preselectTempleId ? 'selected' : ''}>${escapeHtml(t.Name)}</option>`).join('')}
        </select>

        <div class="form-row">
          <div><label for="pl-date">Planned Date</label><input type="date" id="pl-date" required></div>
          <div><label for="pl-time">Planned Time</label><input type="time" id="pl-time"></div>
        </div>
        <label for="pl-endtime">End Time</label>
        <input type="time" id="pl-endtime">

        <label>Who With</label>
        ${people.length
          ? `<div class="check-group">${people.map((p, i) => `
              <label><input type="checkbox" name="whowith" value="${p.Id}" id="ww-${i}"> ${escapeHtml(p.DisplayName || p.FirstName)}</label>
            `).join('')}</div>`
          : `<p class="note">No People yet — <a href="people.html">add some</a> to select them here.</p>`}

        <label for="pl-group">Group</label>
        <input type="text" id="pl-group" placeholder="Ward Youth, Family Group...">

        <label>Planned Purpose</label>
        ${checkGroupHtml('purpose', vocab.purposes || [], 'pp')}

        <label>Planned Work</label>
        ${checkGroupHtml('work', vocab.workTypes || [], 'wk')}

        <label for="pl-notes">Notes</label>
        <textarea id="pl-notes" rows="2" placeholder="Meet at our house at 8:30, dinner afterward..."></textarea>

        <p><label class="checkbox"><input type="checkbox" id="pl-scheduled"> Appointment Scheduled with the temple</label></p>

        <div id="form-msg"></div>
        <div class="form-actions">
          <button type="submit" class="btn">Save Plan</button>
          <a class="btn secondary" href="plans.html">Cancel</a>
        </div>
      </form>
    `;

    document.getElementById('plan-form').addEventListener('submit', submitForm);
  } catch (err) {
    handleError(content, err);
  }
}
loadForm();
</script>
</body>
</html>
